<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мои задачи · стекло</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Задачи">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    font-family: system-ui, 'Segoe UI', sans-serif;
    background: #0b1020;
    color: #fff;
    overflow-x: hidden;
  }
  .glow { position: fixed; border-radius: 50%; filter: blur(110px); opacity: .3; z-index: 0; pointer-events: none; }
  .g1 { width: 420px; height: 420px; background: #6d5ef7; top: -120px; left: -100px; }
  .g2 { width: 380px; height: 380px; background: #22d3ee; bottom: -120px; right: -100px; }

  main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 16px; }
  h1 { text-align: center; font-size: 32px; margin-bottom: 22px; color: #fff; }

  .glass {
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
  }

  form.glass { display: flex; gap: 8px; padding: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  input[type="text"], select, input[type="date"] {
    padding: 12px 16px; font-size: 16px;
    background: rgba(255,255,255,.09); color: #fff;
    border: 1px solid rgba(255,255,255,.2); border-radius: 12px; outline: none;
  }
  input::placeholder { color: rgba(255,255,255,.45); }
  input:focus, select:focus { border-color: #6d5ef7; box-shadow: 0 0 0 3px rgba(109,94,247,.25); }
  select option { color: #111; }
  button { touch-action: manipulation; }
  form button {
    padding: 12px 22px; border: none; border-radius: 12px; cursor: pointer;
    font-weight: 700; color: #fff; font-size: 15px;
    background: #6d5ef7; transition: background .15s;
  }
  form button:hover { background: #5a4be0; }

  #board { display: flex; gap: 16px; align-items: flex-start; }
  #board::-webkit-scrollbar { height: 6px; }
  #board::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }

  .column { flex: 1; padding: 12px; min-height: 340px; transition: border-color .15s, box-shadow .15s; }
  .column.over { border-color: #22d3ee; box-shadow: 0 0 22px rgba(34,211,238,.3); }
  .column h2 { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; margin-bottom: 14px; }
  .count { background: rgba(255,255,255,.14); border-radius: 999px; padding: 1px 10px; font-size: 13px; }

  .card {
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px; padding: 12px; margin-bottom: 10px;
    cursor: grab; transition: transform .12s, box-shadow .12s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.4); }
  .card:active { cursor: grabbing; }
  .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .card-title { flex: 1; font-weight: 600; word-break: break-word; line-height: 1.3; }
  .tag-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(109,94,247,.4); white-space: nowrap; }
  .priority-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .priority-high { background: #f87171; box-shadow: 0 0 6px #f87171; }
  .priority-medium { background: #fbbf24; }
  .priority-low { background: #34d399; }
  .progress-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 2px; background: #22d3ee; transition: width .3s; }
  .card-meta { display: flex; gap: 8px; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.5); }
  .card-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  .card-actions button {
    border: none; background: rgba(255,255,255,.14); color: #fff;
    border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  .card-actions button:hover { background: rgba(255,255,255,.28); }
  .empty { text-align: center; color: rgba(255,255,255,.35); padding: 20px 0; font-size: 14px; }

  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal { width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 28px; position: relative; }
  .modal h2 { font-size: 22px; margin-bottom: 18px; padding-right: 30px; }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: none; border: none; color: rgba(255,255,255,.6);
    font-size: 24px; cursor: pointer;
  }
  .modal-close:hover { color: #fff; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: rgba(255,255,255,.6); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 14px; font-size: 16px;
    background: rgba(255,255,255,.09); color: #fff;
    border: 1px solid rgba(255,255,255,.2); border-radius: 10px; outline: none; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 70px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #6d5ef7; }

  .steps-list { list-style: none; }
  .step-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .step-item input[type="checkbox"] { accent-color: #6d5ef7; width: 18px; height: 18px; cursor: pointer; }
  .step-item.done span { text-decoration: line-through; color: rgba(255,255,255,.4); }
  .step-item span { flex: 1; }
  .step-item .remove-step { background: none; border: none; color: rgba(255,255,255,.3); cursor: pointer; font-size: 16px; padding: 0 4px; }
  .step-item .remove-step:hover { color: #f87171; }
  .add-step-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-step-row input { flex: 1; }
  .add-step-row button { padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer; background: rgba(255,255,255,.14); color: #fff; font-size: 14px; }
  .add-step-row button:hover { background: rgba(255,255,255,.24); }

  .modal-save {
    margin-top: 20px; width: 100%; padding: 14px; border: none; border-radius: 12px;
    cursor: pointer; font-weight: 700; color: #fff; font-size: 16px; background: #6d5ef7;
  }
  .modal-save:hover { background: #5a4be0; }

  /* ================= АДАПТИВ ================= */
  @media (max-width: 820px) {
    main { padding: 16px 0 24px; }
    h1 { font-size: 24px; margin: 8px 16px 16px; }
    form.glass { margin: 0 12px 16px; }
    form.glass input[type="text"] { flex: 1 1 100%; }
    form.glass select { flex: 1; }
    form.glass button { flex: 1; }

    /* колонки листаются как в Trello */
    #board {
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      gap: 12px;
      padding: 4px 12px 18px;
    }
    .column {
      flex: 0 0 84%;
      scroll-snap-align: center;
      min-height: 62vh;
    }
    .card-actions button { padding: 8px 14px; font-size: 15px; }
  }
  @media (max-width: 380px) {
    .column { flex-basis: 90%; }
    h1 { font-size: 21px; }
  }
  @supports (padding: env(safe-area-inset-top)) {
    main { padding-top: calc(16px + env(safe-area-inset-top)); }
  }
</style>
</head>
<body>

<div class="glow g1"></div>
<div class="glow g2"></div>

<main>
  <h1>Мои задачи</h1>

  <form id="form" class="glass">
    <input type="text" id="input" placeholder="Новая задача..." autocomplete="off">
    <select id="col-select">
      <option value="todo">⏳ Ожидание</option>
      <option value="work">🔧 В работе</option>
      <option value="done">✅ Готово</option>
    </select>
    <button type="submit">Добавить</button>
  </form>

  <div id="board">
    <div class="column glass" data-status="todo"><h2>⏳ Ожидание <span class="count">0</span></h2><div class="cards"></div></div>
    <div class="column glass" data-status="work"><h2>🔧 В работе <span class="count">0</span></h2><div class="cards"></div></div>
    <div class="column glass" data-status="done"><h2>✅ Готово <span class="count">0</span></h2><div class="cards"></div></div>
  </div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal glass" id="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <h2 id="m-title-display"></h2>
    <div class="field"><label>Название</label><input type="text" id="m-text"></div>
    <div class="field"><label>Описание</label><textarea id="m-desc" placeholder="Подробности задачи..."></textarea></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <div class="field" style="flex:1;min-width:140px;"><label>Тег</label><input type="text" id="m-tag" placeholder="например: работа"></div>
      <div class="field" style="flex:1;min-width:140px;"><label>Приоритет</label>
        <select id="m-priority">
          <option value="high">🔴 Высокий</option>
          <option value="medium">🟡 Средний</option>
          <option value="low">🟢 Низкий</option>
        </select>
      </div>
      <div class="field" style="flex:1;min-width:140px;"><label>Дедлайн</label><input type="date" id="m-deadline"></div>
    </div>
    <div class="field">
      <label>Чеклист: что сделано</label>
      <ul class="steps-list" id="m-steps"></ul>
      <div class="add-step-row">
        <input type="text" id="m-new-step" placeholder="Новый шаг...">
        <button type="button" id="m-add-step">+ Шаг</button>
      </div>
    </div>
    <button class="modal-save" id="m-save">Сохранить</button>
  </div>
</div>

<script>
// ================== ВАШ URL ==================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7SGMITBwfW6KGj_aP84NgdBW-Rswy59aoLfdKYLyL5-5CRJG2QEgy3rRUtc3Zv0aVQA/exec';
// =============================================

const STATUSES = ['todo', 'work', 'done'];
const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };
let tasks = [];
let editingTask = null;

const form = document.getElementById('form');
const input = document.getElementById('input');
const colSelect = document.getElementById('col-select');
const overlay = document.getElementById('modal-overlay');
const modalClose = document.getElementById('modal-close');
const mTitleDisplay = document.getElementById('m-title-display');
const mText = document.getElementById('m-text');
const mDesc = document.getElementById('m-desc');
const mTag = document.getElementById('m-tag');
const mPriority = document.getElementById('m-priority');
const mDeadline = document.getElementById('m-deadline');
const mSteps = document.getElementById('m-steps');
const mNewStep = document.getElementById('m-new-step');
const mAddStep = document.getElementById('m-add-step');
const mSave = document.getElementById('m-save');

function send(payload) {
  return fetch(SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
  }).catch(err => {
    console.error('Ошибка синхронизации:', err);
    alert('Не удалось сохранить изменения. Проверь интернет.');
  });
}

async function apiGet() {
  const res = await fetch(SCRIPT_URL + '?_=' + Date.now());
  if (!res.ok) throw new Error('GET failed: ' + res.status);
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}

// важные выше, потом ближайшие дедлайны
function sortTasks(list) {
  return list.slice().sort((a, b) => {
    const pa = PRIORITY_ORDER[a.priority] !== undefined ? PRIORITY_ORDER[a.priority] : 1;
    const pb = PRIORITY_ORDER[b.priority] !== undefined ? PRIORITY_ORDER[b.priority] : 1;
    if (pa !== pb) return pa - pb;
    const da = a.deadline || '9999-12-31';
    const db = b.deadline || '9999-12-31';
    if (da !== db) return da < db ? -1 : 1;
    return String(a.id) < String(b.id) ? -1 : 1;
  });
}

function updateTaskStatus(task, newStatus) {
  task.status = newStatus;
  render();
  send({ action: 'update', id: task.id, fields: { status: newStatus } });
}

function getProgress(steps) {
  if (!steps || !steps.length) return null;
  return Math.round((steps.filter(s => s.done).length / steps.length) * 100);
}
function formatDate(d) {
  if (!d) return '';
  const parts = d.split('-');
  return parts[2] + '.' + parts[1];
}

function renderCard(t) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;

  const header = document.createElement('div');
  header.className = 'card-header';

  const dot = document.createElement('div');
  dot.className = 'priority-dot priority-' + (t.priority || 'medium');

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = t.text;

  header.append(dot, title);
  if (t.tag) {
    const badge = document.createElement('span');
    badge.className = 'tag-badge';
    badge.textContent = t.tag;
    header.appendChild(badge);
  }
  card.appendChild(header);

  const progress = getProgress(t.steps);
  if (progress !== null) {
    const bar = document.createElement('div');
    bar.className = 'progress-bar';
    const fill = document.createElement('div');
    fill.className = 'progress-fill';
    fill.style.width = progress + '%';
    bar.appendChild(fill);
    card.appendChild(bar);
  }

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  if (t.deadline) meta.textContent = '📅 ' + formatDate(t.deadline);
  if (progress !== null) meta.textContent += (meta.textContent ? '  ·  ' : '') + progress + '% выполнено';
  if (meta.textContent) card.appendChild(meta);

  const idx = STATUSES.indexOf(t.status);
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  if (idx > 0) {
    const b = document.createElement('button');
    b.textContent = '←';
    b.onclick = (e) => { e.stopPropagation(); updateTaskStatus(t, STATUSES[idx - 1]); };
    actions.appendChild(b);
  }
  if (idx < STATUSES.length - 1) {
    const b = document.createElement('button');
    b.textContent = '→';
    b.onclick = (e) => { e.stopPropagation(); updateTaskStatus(t, STATUSES[idx + 1]); };
    actions.appendChild(b);
  }
  const del = document.createElement('button');
  del.textContent = '🗑';
  del.onclick = (e) => {
    e.stopPropagation();
    if (!confirm('Удалить задачу?')) return;
    tasks = tasks.filter(x => x.id !== t.id);
    render();
    send({ action: 'delete', id: t.id });
  };
  actions.appendChild(del);
  card.appendChild(actions);

  card.addEventListener('click', () => openModal(t));
  card.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', t.id));
  return card;
}

function render() {
  document.querySelectorAll('.column').forEach(col => {
    const status = col.dataset.status;
    const box = col.querySelector('.cards');
    const list = sortTasks(tasks.filter(t => t.status === status));
    col.querySelector('.count').textContent = list.length;
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<p class="empty">пусто</p>'; return; }
    list.forEach(t => box.appendChild(renderCard(t)));
  });
}

document.querySelectorAll('.column').forEach(col => {
  col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
  col.addEventListener('dragleave', () => col.classList.remove('over'));
  col.addEventListener('drop', e => {
    e.preventDefault();
    col.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain');
    const task = tasks.find(x => String(x.id) === id);
    if (task && task.status !== col.dataset.status) {
      updateTaskStatus(task, col.dataset.status);
    }
  });
});

form.onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  tasks.push({
    id: 'tmp' + Date.now(),
    text, status: colSelect.value,
    description: '', tag: '', priority: 'medium', deadline: '', steps: [],
  });
  input.value = '';
  render();
  send({ action: 'add', task: { text, status: colSelect.value } });
  setTimeout(() => apiGet().then(data => { tasks = data; render(); }).catch(() => {}), 1500);
};

function renderSteps(steps) {
  mSteps.innerHTML = '';
  (steps || []).forEach((s, i) => {
    const li = document.createElement('li');
    li.className = 'step-item' + (s.done ? ' done' : '');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = s.done;
    cb.onchange = () => { s.done = cb.checked; li.classList.toggle('done', s.done); };
    const span = document.createElement('span');
    span.textContent = s.text;
    const rm = document.createElement('button');
    rm.className = 'remove-step';
    rm.textContent = '✕';
    rm.onclick = () => { steps.splice(i, 1); renderSteps(steps); };
    li.append(cb, span, rm);
    mSteps.appendChild(li);
  });
}

function openModal(task) {
  editingTask = task;
  mTitleDisplay.textContent = task.text;
  mText.value = task.text || '';
  mDesc.value = task.description || '';
  mTag.value = task.tag || '';
  mPriority.value = ['high', 'medium', 'low'].includes(task.priority) ? task.priority : 'medium';
  mDeadline.value = task.deadline || '';
  editingTask._stepsCopy = JSON.parse(JSON.stringify(task.steps || []));
  renderSteps(editingTask._stepsCopy);
  overlay.classList.add('open');
}
function closeModal() { overlay.classList.remove('open'); editingTask = null; }
modalClose.onclick = closeModal;
overlay.onclick = e => { if (e.target === overlay) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

mAddStep.onclick = () => {
  const text = mNewStep.value.trim();
  if (!text || !editingTask) return;
  editingTask._stepsCopy.push({ text, done: false });
  mNewStep.value = '';
  renderSteps(editingTask._stepsCopy);
};
mNewStep.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); mAddStep.click(); } });

mSave.onclick = () => {
  if (!editingTask) return;
  const task = editingTask;
  const updates = {
    text: mText.value.trim(),
    description: mDesc.value.trim(),
    tag: mTag.value.trim(),
    priority: mPriority.value,
    deadline: mDeadline.value,
    steps: task._stepsCopy,
  };
  if (!updates.text) return;
  Object.assign(task, updates);
  closeModal();
  render();
  send({ action: 'update', id: task.id, fields: updates });
};

// PWA: сервис-воркер (работает только по https)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

apiGet()
  .then(data => { tasks = data; render(); console.log('Загружено задач:', tasks.length); })
  .catch(err => {
    console.error(err);
    alert('Не удалось загрузить задачи: ' + err.message);
  });
</script>
</body>
</html>
